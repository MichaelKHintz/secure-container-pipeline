apiVersion: v1
kind: Namespace
metadata:
  name: secure-app
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: fastapi-app
  namespace: secure-app
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-app
  namespace: secure-app
spec:
  selector:
    app.kubernetes.io/name: fastapi-app
    ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: fastapi-app
  name: fastapi-app
  namespace: secure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-app
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ${ECR_REGISTRY}/secure-container-pipeline@sha256:91517607bdb7967cd5614823f6573176d9c5a3f83ef04fbeaf1c2292525eb2d1
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        name: app
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: fastapi-app
      volumes:
      - emptyDir:
          sizeLimit: 16Mi
        name: tmp
