apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: secure-container-pipeline
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/MichaelKHintz/secure-container-pipeline
  ref:
    branch: deploy
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fastapi-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./rendered
  prune: true
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: secure-container-pipeline
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars #holds ECR_Registry; created from Terraform output, never in Git
