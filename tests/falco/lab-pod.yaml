apiVersion: v1
kind: Namespace
metadata:
  name: falco-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: lab
  namespace: falco-lab
spec:
  automountServiceAccountToken: false
  containers:
    - name: lab
      image: debian:trixie-slim
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
